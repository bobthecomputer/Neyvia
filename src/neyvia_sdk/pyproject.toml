[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neyvia-sdk"
version = "1.0.0"
description = "Transport-only client for Neyvia's shared app services"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["neyvia_sdk"]
package-dir = { neyvia_sdk = "." }
