<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061317" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f1e7" media="(prefers-color-scheme: light)">
  <meta name="description" content="Your course, as a feed. Short cards, questions only on what you have seen, and it ends when the work is done.">
  <title>Scroll Study</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ss" id="app">
    <header class="ss-top">
      <div class="ss-goal" id="goal" role="progressbar" aria-label="Today's goal" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0"><span class="ss-goal-fill"></span></div>
      <div class="ss-top-row">
        <span class="ss-count" id="count">0 of 20</span>
        <span class="ss-spacer"></span>
        <span class="ss-pill ss-run" id="run" aria-live="polite"></span>
        <span class="ss-pill ss-streak" id="streak" title="Days in a row you reached your goal"></span>
        <button type="button" class="ss-iconbtn" id="menu" aria-label="Menu"></button>
      </div>
    </header>
    <main class="ss-viewport" id="viewport">
      <div class="ss-track" id="track"></div>
    </main>
  </div>
  <script src="pack.js"></script>
  <script src="load-pack.js"></script>
  <script src="vendor/ts-fsrs.js"></script>
  <script src="feed.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
  <script type="module" src="neyvia-services.js"></script>
</body>
</html>
