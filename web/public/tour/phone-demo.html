<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Garden</title>
<style>
  :root { color-scheme: light; --leaf: #2f7d4f; --sun: #f2a33a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f3ea; color: #1d2a22; }
  header { padding: 18px 18px 10px; }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 4px 0 0; color: #56645b; }
  ul { list-style: none; margin: 8px 12px; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #e3efe6; font-size: 18px; }
  .when { margin-left: auto; font-size: 13px; color: var(--leaf); font-weight: 600; }
  .due .when { color: var(--sun); }
  button { position: fixed; right: 18px; bottom: 26px; border: 0; border-radius: 999px; padding: 14px 20px; background: var(--leaf); color: #fff; font: 600 15px system-ui, sans-serif; }
</style>
</head>
<body>
<header><h1>Pocket Garden</h1><p>3 plants · 1 needs water today</p></header>
<ul>
  <li class="due"><span class="dot">🌿</span>Basil<span class="when">Water today</span></li>
  <li><span class="dot">🍅</span>Tomatoes<span class="when">In 2 days</span></li>
  <li><span class="dot">🌱</span>Mint<span class="when">In 4 days</span></li>
</ul>
<button type="button">Add a plant</button>
</body>
</html>
