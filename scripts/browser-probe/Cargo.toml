[package]
name = "neyvia-browser-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.0", features = ["tray-icon", "unstable"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "net", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[[bin]]
name = "browser-proof"
path = "src/main.rs"

[[bin]]
name = "browser-proof-c2d"
path = "src/main.rs"

[[bin]]
name = "browser-proof-c2d-roles"
path = "src/main.rs"
