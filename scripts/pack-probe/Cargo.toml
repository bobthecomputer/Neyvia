[package]
name = "neyvia-pack-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
minisign-verify = "0.2.5"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "sync"] }

[[bin]]
name = "neyvia-pack-probe"
path = "main.rs"
