<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neyvia 3D Studio</title>
<style>
:root{--bg:#1c1e22;--bar:rgba(34,36,41,.84);--line:rgba(236,238,241,.12);--text:#eceef1;--muted:#a9aeb7;--accent:#4da3ff;--accent-ink:#051a33;--btn:rgba(236,238,241,.07);--btn-hover:rgba(236,238,241,.13);color-scheme:dark}
body[data-look="light"]{--bg:#e8eaed;--bar:rgba(251,251,252,.86);--line:rgba(29,32,37,.14);--text:#1d2025;--muted:#4c5159;--accent:#1769d1;--accent-ink:#fff;--btn:rgba(29,32,37,.06);--btn-hover:rgba(29,32,37,.11);color-scheme:light}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;overflow:hidden;transition:background-color .32s ease}
.viewport{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.bar{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;pointer-events:none}
.tools{display:flex;align-items:center;gap:2px;padding:4px;border-radius:12px;background:var(--bar);box-shadow:0 0 0 1px var(--line),4px 10px 28px -14px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:auto}
.tools input{width:96px;height:28px;padding:0 9px;border:0;border-radius:8px;background:var(--btn);color:var(--text);font:inherit}
.tools button{height:28px;padding:0 10px;white-space:nowrap;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;font-weight:600;cursor:pointer;transition:background .18s ease,transform .2s cubic-bezier(.22,1,.36,1)}
.tools button:hover{background:var(--btn-hover)}.tools button:active{transform:scale(.96)}
.tools button.primary{background:var(--accent);color:var(--accent-ink)}.tools .sep{width:1px;height:18px;margin:0 4px;background:var(--line)}
.status{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--bar);box-shadow:0 0 0 1px var(--line);color:var(--muted);font-weight:600;pointer-events:auto;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}.status.is-on i{background:#7fd6a4;box-shadow:0 0 0 3px rgba(127,214,164,.2)}.status.is-off i{background:#f48a7a}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:5px 12px;border-radius:999px;background:var(--bar);box-shadow:0 0 0 1px var(--line);color:var(--muted);font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .6s ease}
.activity{position:absolute;right:10px;bottom:10px;max-width:min(420px,calc(100% - 20px));border-radius:12px;background:var(--bar);box-shadow:0 0 0 1px var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.activity summary{padding:6px 12px;color:var(--muted);font-weight:600;cursor:pointer;list-style:none}.activity summary::-webkit-details-marker{display:none}
.activity pre{margin:0;padding:0 12px 10px;max-height:32vh;overflow:auto;white-space:pre-wrap;font:11.5px/1.45 "Cascadia Code",ui-monospace,monospace;color:var(--text)}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 70% at 50% 30%,color-mix(in srgb,var(--text) 6%,transparent),transparent 70%),var(--bg)}
.fallback[hidden]{display:none}.fallback div{max-width:420px;text-align:center;display:grid;gap:10px;justify-items:center}
.fallback strong{font-size:16px}.fallback p{margin:0;color:var(--muted);line-height:1.55}
.fallback svg{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.tools input{width:72px}.tools button{padding:0 8px}.hint{display:none}.status{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<body data-look="dark">
<div class="viewport">
 <canvas id="scene" aria-label="Interactive 3D scene: drag to look around, click a mesh to select it" tabindex="0"></canvas>
 <div class="fallback" id="fallback" hidden><div>
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>
  <strong id="fallback-title">This browser can't draw 3D</strong>
  <p id="fallback-text">WebGL is turned off or not available here, so the scene can't be shown. It is still loaded and agents can still edit it; open it in a browser with hardware acceleration on to see it.</p>
 </div></div>
 <div class="bar">
  <div class="tools" role="toolbar" aria-label="Scene tools">
   <input id="name" aria-label="New mesh name" value="Room"><button id="create" class="primary">Add box</button><span class="sep"></span>
   <button id="rotate">Rotate selected</button><button id="run">Run</button><button id="stop">Stop</button><button id="inspect">Inspect</button>
  </div>
  <span id="status" class="status" role="status"><i></i><span id="status-text">Connecting…</span></span>
 </div>
 <div class="hint" id="hint">Drag to look around · scroll to zoom · click a mesh to select it</div>
 <details class="activity"><summary>Activity</summary><pre id="receipt" aria-live="polite"></pre></details>
</div>
<script src="/api/gamedev/static/babylon.js"></script><script src="/api/gamedev/static/babylonjs.loaders.min.js"></script><script src="/api/gamedev/static/babylonjs.serializers.min.js"></script><script src="/api/gamedev/static/scene-runtime.js"></script>
<script>
const config = __NEYVIA_CONFIG_JSON__;
const output=document.getElementById('receipt'), statusBox=document.getElementById('status'), statusText=document.getElementById('status-text'), canvas=document.getElementById('scene');
const setStatus=(text,state)=>{statusText.textContent=text;statusBox.className='status'+(state?' is-'+state:'');};
// Light or dark studio: from the address first, then from Neyvia whenever its theme changes.
let look=new URLSearchParams(location.search).get('look')==='light'?'light':'dark';
document.body.dataset.look=look;
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='neyvia:look')return;look=event.data.tone==='light'?'light':'dark';document.body.dataset.look=look;runtime?.setLook?.(look);});
async function post(path,body,bridge=false){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',...(bridge?{Authorization:'Bearer '+config.token}:{})},body:JSON.stringify(body)});const answer=await response.json();if(!answer.ok)throw Error(answer.error||'Request failed');return answer.data;}
const base='/api/gamedev/bridge/';let sessionId;
// WebGL when the browser has it; otherwise Babylon's NullEngine keeps the real scene loaded for
// agents, and the page says plainly why there is no picture.
function showFallback(title,text){document.getElementById('fallback').hidden=false;document.getElementById('hint').hidden=true;if(title)document.getElementById('fallback-title').textContent=title;if(text)document.getElementById('fallback-text').textContent=text;}
let engine=null,drawn=false;
if(typeof BABYLON==='undefined'||typeof NeyviaScene==='undefined'){showFallback('The 3D engine did not load','Neyvia could not load Babylon.js from this PC. Reload the scene; if it keeps happening, the game-dev runtime files are missing.');setStatus('Not loaded','off');throw Error('Babylon.js did not load');}
try{if(BABYLON.Engine.isSupported()){engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true});drawn=true;}}catch{engine=null;}
if(!engine){engine=new BABYLON.NullEngine();showFallback();}
const runtime = new NeyviaScene(BABYLON,engine,{
 headless:!drawn,
 beforeMutate:async expected=>{const response=await fetch('/api/gamedev/browser-state?project='+encodeURIComponent(config.projectPath));const value=await response.json();if(!value.ok)throw Error(value.error);if(value.data.sha256!==expected)throw Error('Persisted scene changed; reload before editing');},
 persist:async (data,expectedSha256)=>post('/api/gamedev/browser-save',{projectPath:config.projectPath,path:config.projectPath+'/.neyvia/scene.babylon',data:btoa(unescape(encodeURIComponent(data))),expectedSha256}),
 exportAsset:async(path,bytes,expectedSha256)=>post('/api/gamedev/browser-save',{projectPath:config.projectPath,path,data:btoa(Array.from(bytes,b=>String.fromCharCode(b)).join('')),expectedSha256}),
});
// The selected mesh carries an outline in the accent colour.
let outlined=null;
function outline(){const name=runtime.selected;if(outlined===name)return;for(const mesh of runtime.scene.meshes){mesh.renderOutline=Boolean(name)&&mesh.name===name;if(mesh.renderOutline){mesh.outlineWidth=.035;mesh.outlineColor=look==='light'?new BABYLON.Color3(.09,.41,.82):new BABYLON.Color3(.3,.64,1);}}outlined=name;}
// Actual pointer picking selects the native Babylon mesh; receipt uses the same API as bots.
function attach(){runtime.camera.attachControl(canvas,true);runtime.scene.onPointerObservable.add(async ev=>{if(ev.type===BABYLON.PointerEventTypes.POINTERPICK&&ev.pickInfo?.pickedMesh?.isPickable){await userAction('select',{name:ev.pickInfo.pickedMesh.name});}});runtime.scene.onBeforeRenderObservable.add(()=>{if(runtime.running)for(const mesh of runtime.scene.meshes)if(mesh.metadata?.spin)mesh.rotation.y+=.015;outline();});}
runtime.options.loadAsset=async(path,scene)=>{const response=await fetch('/api/gamedev/asset?path='+encodeURIComponent(path));if(!response.ok)throw Error('Asset read failed');return BABYLON.SceneLoader.ImportMeshAsync('', '', new Uint8Array(await response.arrayBuffer()),scene,null,'.glb');};
window.addEventListener('resize',()=>engine.resize());
canvas.addEventListener('pointerdown',()=>{document.getElementById('hint').style.opacity='0';},{once:true});
async function userAction(action,args={}){try{const queued=await post('/api/backend',{command:'gamedev_action_command',payload:{sessionId,action,args}});output.textContent=JSON.stringify(queued,null,2);}catch(e){output.textContent=e.message;}}
document.getElementById('create').onclick=()=>userAction('edit',{op:'create',name:document.getElementById('name').value});
document.getElementById('rotate').onclick=()=>userAction('interact',{name:runtime.selected,rotateY:.25});
for(const action of ['run','stop','inspect'])document.getElementById(action).onclick=()=>userAction(action);
window.addEventListener('error',e=>runtime.logs.push({level:'error',message:e.message}));
window.addEventListener('unhandledrejection',e=>runtime.logs.push({level:'error',message:String(e.reason)}));
async function poll(){try{const value=await post(base+'poll',{sessionId},true);if(value.request){const request=value.request;let result,error='',state='succeeded';try{result=await runtime.dispatch(request.action,request.args);}catch(e){state='failed';error=e.message;runtime.logs.push({level:'error',message:error});}const receipt=await post(base+'complete',{sessionId,requestId:request.requestId,status:state,result:result||{},error},true);output.textContent=JSON.stringify(receipt,null,2);}}catch(e){setStatus(e.message,'off');}setTimeout(poll,300);}
async function start(){
 const response=await fetch('/api/gamedev/browser-state?project='+encodeURIComponent(config.projectPath));const saved=await response.json();if(!saved.ok)throw Error(saved.error);
 if(saved.data.scene){const restored=await BABYLON.SceneLoader.LoadAsync('', 'data:'+JSON.stringify(saved.data.scene),engine);runtime.scene.dispose();runtime.scene=restored;runtime.camera=restored.activeCamera;runtime.light=restored.lights[0]||null;runtime.savedHash=saved.data.sha256;runtime.revision=restored.metadata?.neyviaRevision||0;runtime.setLook(look);}
 else runtime.seedStudio(look); // a new project opens on a lit studio scene, never an empty box
 attach();
 if(drawn)engine.runRenderLoop(()=>runtime.scene.render());
 const value=await post(base+'register',{engine:'babylon',projectPath:config.projectPath,context:'Edit',environment:drawn?'browser-webgl':'browser-null',capabilities:['inspect','select','edit','run','interact','console','stop','test','export','load_asset']},true);sessionId=value.sessionId;setStatus(drawn?'Connected':'Connected · no picture',drawn?'on':'');poll();}
start().catch(e=>setStatus(e.message,'off'));
</script></html>
