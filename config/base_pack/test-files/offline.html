<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="#071225" name="theme-color" />
    <title>Neyvia is offline</title>
    <style>
      :root { color-scheme: dark; font-family: "DM Sans", system-ui, sans-serif; background: #071225; color: #f4f7fb; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(520px, 100%); border-top: 1px solid #2b4265; padding-top: 32px; }
      span { color: #d4a54b; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
      h1 { font-size: clamp(32px, 8vw, 56px); letter-spacing: -.05em; margin: 12px 0; }
      p { color: #aebbd0; line-height: 1.6; }
      button { border: 0; border-radius: 999px; background: #f4f7fb; color: #071225; padding: 12px 18px; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <span>NAS connection unavailable</span>
      <h1>Neyvia is offline.</h1>
      <p>The app shell is installed, but live NAS controls and mission data require a secure connection. Reconnect to your LAN, Tailscale, or HTTPS endpoint and try again.</p>
      <button onclick="window.location.reload()" type="button">Try again</button>
    </main>
  </body>
</html>
