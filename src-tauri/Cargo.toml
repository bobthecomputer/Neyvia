[package]
name = "neyvia-desktop"
default-run = "neyvia-desktop"
autobins = false
version = "0.2.2"
description = "Neyvia supervised intelligence ecosystem desktop shell"
authors = ["Paul"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "neyvia-desktop"
path = "src/main.rs"

[lib]
name = "neyvia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
memory-stats = "1.2.0"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time", "net", "io-util", "sync"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
arboard = "3.6.1"
active-win-pos-rs = "0.9.1"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
minisign-verify = "0.2.5"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
minisign-verify = "0.2.5"
