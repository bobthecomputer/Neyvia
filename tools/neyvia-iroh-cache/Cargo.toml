[package]
name = "neyvia-iroh-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Neyvia's allowlisted Iroh blob-transfer sidecar"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "=0.8.9", default-features = false, features = ["json", "tokio", "http1"] }
blake3 = "1.8.2"
futures-lite = "2.6.1"
iroh = { version = "=1.0.3" }
iroh-blobs = { version = "=0.103.0", features = ["fs-store"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"
