<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="dot" id="dot"></span> Card Console</div>
    <div class="env" id="env">connecting\u2026</div>
    <button id="refresh" class="btn">Refresh</button>
  </header>

  <main>
    <section class="panel" id="panel-chameleon">
      <h2>Chameleon Ultra <span class="muted" id="chameleon-state"></span></h2>
      <div id="chameleon" class="stack"></div>
    </section>

    <section class="panel" id="panel-devices">
      <h2>Connected devices <span class="muted" id="devices-source"></span></h2>
      <div id="devices" class="stack"></div>
    </section>

    <section class="panel">
      <h2>Card reader</h2>
      <div id="reader" class="stack"></div>
      <div class="row-actions">
        <button id="scan" class="btn primary">Read tag UID</button>
      </div>
      <pre id="scan-out" class="out"></pre>
    </section>

    <section class="panel">
      <h2>Toolchain</h2>
      <table id="tools">
        <thead><tr><th>Tool</th><th>Role</th><th>State</th><th>Version</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>localhost only \u00b7 read/inventory \u00b7 no key recovery, no card writes</footer>

  <script src="/app.js"></script>
</body>
</html>
